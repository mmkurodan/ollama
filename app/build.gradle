plugins {
    id 'com.android.application'
}

android {
    namespace "com.micklab.llama"
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    // 版付: release更新のため単調増加。分単位UNIXエポック(int32安全, 旧Actions番号より必ず大)。
    // ローカル(build-local.sh)/CI 共通で機能。VERSION_CODE/VERSION_NAME env で上書き可。
    // 旧: versionName "1.${GITHUB_RUN_NUMBER}" は廃止（ローカルビルドで番号が付かず更新不可のため）。
    def verCode = System.getenv("VERSION_CODE") ? System.getenv("VERSION_CODE").toInteger() : ((System.currentTimeMillis() / 60000L) as int)
    def verName = System.getenv("VERSION_NAME") ?: new java.text.SimpleDateFormat("yyyy.MM.dd.HHmm").format(new java.util.Date())

    defaultConfig {
        applicationId "com.micklab.llama"
        minSdk 24
        targetSdk 36

        versionCode verCode
        versionName verName

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                // GPU(OpenCL) backend: CI passes the libOpenCL.so to link against
                // (NDK-agnostic). When unset, the OpenCL plugin is simply not built.
                def openclStubLib = System.getenv("OPENCL_STUB_LIB")
                if (openclStubLib) {
                    arguments "-DOPENCL_STUB_LIB=${openclStubLib}"
                }
            }
        }
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            // R8: shrink + obfuscate code. Resource shrinking is intentionally left
            // off (shrinkResources) to avoid stripping resources referenced only
            // indirectly. Keep rules for the JNI boundary live in proguard-rules.pro;
            // the release build emits mapping.txt for crash de-obfuscation.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    ndkVersion "27.2.12479018"

    // GPU プラグイン libggml-opencl.so は dlopen で nativeLibraryDir から読み込むため、
    // APK 内に圧縮格納せず必ず展開する (extractNativeLibs=true 相当)。
    packaging {
        jniLibs {
            useLegacyPackaging = true
            // libOpenCL.so is only linked against (the real driver is provided by the
            // device and declared via <uses-native-library>). Do not ship the link stub;
            // it would also fail the 16KB-alignment check.
            excludes += ["**/libOpenCL.so"]
        }
    }
}

dependencies {
}
